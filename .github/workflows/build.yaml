name: Build executable
run-name: Building new version

on:
  release:
    types:
      - prereleased
      - released

jobs:
  build:
    if: github.event.action == 'prereleased'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download deps
        run: go mod download

      - name: Build
        id: build_bin
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |github.com/smsimone/sshm
          mkdir -p dist
          BIN_NAME="sshm"
          EXT=""
          if [ "${GOOS}" = "windows" ]; then EXT=".exe"; fi
          OUT="dist/${BIN_NAME}-${GOOS}-${GOARCH}${EXT}"
          go build -trimpath -ldflags="-s -w" -o "${OUT}" .
          echo "output=${OUT}" >> "${GITHUB_OUTPUT}"

      - name: Upload prerelease asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: ${{ steps.build_bin.outputs.output }}

  release:
    if: github.event.action == 'released'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify promoted assets are present
        uses: actions/github-script@v7
        with:
          script: |
            const releaseId = context.payload.release.id;
            const { data: assets } = await github.rest.repos.listReleaseAssets({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
            });

            if (!assets.length) {
              core.setFailed('No release assets found on promoted release.');
              return;
            }

            core.info(`Promoted github.com/smsimone/sshmase contains ${assets.length} asset(s).`);
